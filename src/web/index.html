<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d12">
    <title>Starter App</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/assets/reset.css">
    <link rel="stylesheet" href="../shared/assets/darktheme.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="app-container">

    <aside class="side-nav">
        <div class="nav-brand">
            <div class="sg-eyebrow">SYSTEM_CORE</div>
            <div class="sg-title">V-FORM</div>
        </div>

        <nav class="nav-list">
            <a href="index.html" class="nav-item active">
                <span class="nav-icon">01</span> HOME
            </a>
            <a href="styleguide.html" class="nav-item">
                <span class="nav-icon">02</span> STYLEGUIDE
            </a>
        </nav>

        <div class="nav-footer">
            <div class="sg-mono">BUILD_2.4.1</div>
        </div>
    </aside>

<main class="main-stage">
    
    <header class="status-header">
        <h1 class="sg-title">Slate Coal <span>Project_Canvas</span></h1>
        <div class="sg-badge">MODE: EDIT_VIEW // ALPHA_0.1</div>
    </header>

    <div class="content-area" style="padding: 0; overflow: hidden; height: calc(100vh - 64px); background: #050608;">
        
        <div id="ui-canvas" style="
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background-image: 
                radial-gradient(circle, rgba(100,110,130,0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            position: relative;
        ">

            <div class="empty-notif" style="text-align: center;">
                <div class="sg-block-label" style="justify-content: center; margin-bottom: 8px; border: none;">CANVAS_INITIALIZED</div>
                <div class="sg-mono" style="opacity: 0.4; font-size: 10px;">Awaiting Component Injection...</div>
            </div>

            <div style="position: absolute; bottom: 16px; left: 16px;" class="sg-mono">
                X: 0.00 // Y: 0.00
            </div>

        </div>
        </div>
    </main>
    
    <script src="index.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('SW: Registered'))
                .catch(err => console.error('SW: Failed', err));
        }
    </script>
</body>
</html>
